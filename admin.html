<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>لوحة التحكم</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--p:#12233f;--a:#c29b4a;--bg:#f2f4f8;--bd:#dfe3ec}*{box-sizing:border-box;margin:0}
body{font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--bg);color:#1b2433;line-height:1.7}
.lgn{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 80% 10%,#c29b4a55,transparent 45%),linear-gradient(135deg,var(--p),#050a14)}
.lc{background:#fff;border-radius:20px;padding:36px 30px;width:min(390px,92vw);text-align:center;border-top:5px solid var(--a);box-shadow:0 20px 60px #0008}
.lc .ic{font-size:46px}.lc h1{font-size:22px;margin:6px 0 20px}.lc input{margin-bottom:12px}#er{color:#c0392b;font-size:13px;min-height:20px}
input,textarea{width:100%;padding:11px 12px;border:1px solid var(--bd);border-radius:10px;font-family:inherit;font-size:14px;background:#fff;color:#1b2433}
input[type=color]{height:42px;padding:3px}input[type=checkbox]{width:auto}input:focus,textarea:focus{outline:2px solid var(--a);border-color:transparent}
button{font-family:inherit;cursor:pointer}.bt{background:var(--a);color:#111;border:0;border-radius:10px;padding:11px 22px;font-weight:700;font-size:15px;width:100%}
aside{position:fixed;top:0;bottom:0;right:0;width:250px;background:var(--p);color:#fff;overflow:auto;padding:18px 12px}
aside .lg{font-weight:800;font-size:19px;color:var(--a);padding:6px 12px 16px}aside a{display:block;padding:10px 14px;border-radius:10px;color:#ffffffcc;cursor:pointer;text-decoration:none;font-size:14px;margin-bottom:2px}
aside a:hover{background:#ffffff14}aside a.on{background:var(--a);color:#111;font-weight:700}
main{margin-inline-end:250px;padding:0 28px 60px}header{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:center;gap:14px;padding:18px 0;border-bottom:1px solid var(--bd);margin-bottom:22px}
header h1{font-size:22px;flex:1}#st{font-size:13px;color:#6b7385}#sv{background:var(--a);color:#111;border:0;border-radius:10px;padding:10px 22px;font-weight:700}
.cd{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:20px}.cd h3{margin-bottom:12px;color:var(--p)}
.f{margin-bottom:14px}.f>label{display:block;font-size:13px;color:#6b7385;margin-bottom:4px;font-weight:600}.pv{height:70px;border-radius:8px;display:block;margin:4px 0;border:1px solid var(--bd)}
.it{border:1px solid var(--bd);border-radius:12px;margin-bottom:10px;background:#fafbfd}.it>summary{cursor:pointer;padding:12px 14px;font-weight:600;display:flex;align-items:center;gap:8px}.it>summary::marker{color:var(--a)}
.it>div{padding:4px 14px 8px}.ac{margin-inline-start:auto;display:flex;gap:6px}.ac button,.b2{background:#fff;border:1px solid var(--bd);border-radius:8px;padding:5px 12px;font-size:13px}.dl{color:#c0392b!important}
.b2.add{border:1.5px dashed var(--a);color:var(--p);font-weight:700;padding:9px 16px}.msg{border-inline-start:4px solid var(--a)}.msg small{color:#6b7385}
@media(max-width:800px){aside{position:static;width:auto;display:flex;overflow-x:auto;gap:6px;padding:10px}aside .lg{display:none}aside a{white-space:nowrap}main{margin:0;padding:0 14px 60px}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S,A={},TAB='gen',dirty=false,reopen='';
const api=(p,o={})=>fetch(p,{...o,headers:{'Content-Type':'application/json','x-admin-user':A.u,'x-admin-password':A.p}});
const gp=p=>p.split('.').reduce((o,k)=>o&&o[k],S),sp=(p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((o,k)=>o[k],S)[l]=v};
const H=['about','services','steps','team','articles','creds','faq','testi','contact','form'],HT={about:'من نحن',services:'الخدمات',steps:'خطوات العمل',team:'الفريق',articles:'المقالات',creds:'الدورات',faq:'الأسئلة الشائعة',testi:'آراء العملاء',contact:'التواصل',form:'عنوان نموذج الرسائل'};
const T=[
{id:'gen',t:'🏠 عام',f:[['name','اسم المؤسسة'],['tagline','العنوان الفرعي'],['hero','نص الواجهة','a'],['cta','نص زر الاستشارة'],['about','نص من نحن','a'],['primary','اللون الأساسي','c'],['accent','لون التمييز','c'],['seo_desc','وصف الموقع لمحركات البحث (SEO)','a']]},
{id:'img',t:'🖼 الشعار والصور',f:[['logo','الشعار (PNG شفاف أفضل)','i'],['heroImg','صورة الواجهة الرئيسية','i'],['aboutImg','صورة من نحن','i']]},
{id:'sec',t:'🔤 عناوين الأقسام',f:H.map(k=>['h_'+k,HT[k]])},
{id:'sv',t:'⚖️ الخدمات',ls:[{l:'services',t:'الخدمات',ti:'t',fs:[['hot','تخصص أبرز (قسم كبير)','k'],['i','أيقونة'],['t','العنوان'],['d','الوصف','a'],['p','النقاط (كل نقطة في سطر)','a']]}]},
{id:'ab',t:'📖 من نحن',ls:[{l:'paras',t:'فقرات',ti:'t',fs:[['t','العنوان'],['d','النص','a']]},{l:'why',t:'لماذا نحن',fs:[['','النص']]},{l:'stats',t:'الأرقام',ti:'l',fs:[['n','الرقم'],['x','رمز بعد الرقم (مثل +)'],['l','الوصف']]}]},
{id:'tm',t:'👥 الفريق',ls:[{l:'team',t:'أعضاء الفريق',ti:'n',fs:[['img','الصورة','i'],['n','الاسم'],['r','المسمى'],['b','نبذة','a']]}]},
{id:'ar',t:'📰 المقالات',ls:[{l:'articles',t:'المقالات',ti:'t',fs:[['img','صورة المقال','i'],['t','العنوان'],['date','التاريخ'],['s','ملخص','a'],['b','نص المقال (كل فقرة في سطر)','a']]}]},
{id:'fq',t:'❓ الأسئلة وآراء العملاء',ls:[{l:'faq',t:'الأسئلة الشائعة',ti:'q',fs:[['q','السؤال'],['a','الإجابة','a']]},{l:'testimonials',t:'آراء العملاء (تظهر فقط لو أضفت)',ti:'n',fs:[['n','الاسم'],['r','الصفة'],['q','الرأي','a']]}]},
{id:'st',t:'🪜 الخطوات والدورات',ls:[{l:'steps',t:'خطوات العمل',ti:'t',fs:[['t','العنوان'],['d','الوصف','a']]},{l:'creds',t:'الدورات والمؤهلات',fs:[['','النص']]}]},
{id:'ct',t:'📞 التواصل والمكاتب',f:[['phone','رقم الهاتف'],['wa','رقم واتساب (بكود الدولة)'],['email','البريد الإلكتروني'],['hours','مواعيد العمل'],['s_fb','رابط فيسبوك'],['s_ig','رابط إنستجرام'],['s_li','رابط لينكد إن'],['s_x','رابط X'],['s_yt','رابط يوتيوب'],['s_tt','رابط تيك توك']],ls:[{l:'offices',t:'المكاتب',ti:'city',fs:[['city','المدينة'],['addr','العنوان'],['map','رابط الخريطة (اختياري)']]}]},
{id:'ft',t:'🔻 الفوتر والصفحات',f:[['foot_about','نبذة الفوتر','a'],['copyright','حقوق النشر'],['foot_note','تنبيه قانوني أسفل الفوتر','a'],['p_privacy','نص سياسة الخصوصية','a'],['p_terms','نص الشروط والأحكام','a'],['p_disclaimer','نص إخلاء المسؤولية','a']]},
{id:'msg',t:'📩 الرسائل'}];
const ADD={services:{i:'⚖️',t:'',d:'',p:'',hot:false},team:{n:'',r:'',b:'',img:''},articles:{t:'',date:'',s:'',b:'',img:''},paras:{t:'',d:''},steps:{t:'',d:''},stats:{n:'',x:'',l:''},testimonials:{n:'',r:'',q:''},faq:{q:'',a:''},offices:{city:'',addr:'',map:''},why:'',creds:''};
const F=(p,[k,l,t])=>{const v=gp(p);return `<div class="f"><label>${l}</label>`+(t=='a'?`<textarea data-p="${p}" rows=3>${esc(v)}</textarea>`:t=='c'?`<input type=color data-p="${p}" value="${esc(v)}">`:t=='k'?`<label><input type=checkbox data-p="${p}" ${v?'checked':''}> مفعّل</label>`:t=='i'?`${v?`<img class="pv" src="${v}">`:''}<input type=file accept="image/*" data-i="${p}">${v?` <button class="b2" data-x="${p}">إزالة الصورة</button>`:''}`:`<input data-p="${p}" value="${esc(v)}">`)+'</div>'};
const LS=({l,t,fs,ti})=>`<div class="cd"><h3>${t}</h3>`+(S[l]||[]).map((x,n)=>{const tt=typeof x=='string'?x:x[ti||fs[0][0]];return `<details class="it" ${reopen==l+'.'+n?'open':''}><summary>${esc(tt)||'(جديد)'}<span class="ac"><button data-mv="${l}.${n}.-1">↑</button><button data-mv="${l}.${n}.1">↓</button><button class="dl" data-dl="${l}.${n}">حذف</button></span></summary><div>${fs.map(f=>F(f[0]?`${l}.${n}.${f[0]}`:`${l}.${n}`,f)).join('')}</div></details>`}).join('')+`<button class="b2 add" data-ad="${l}">+ إضافة</button></div>`;
function show(){const tb=T.find(x=>x.id==TAB);
 $('#app').innerHTML=`<aside><div class="lg">⚖ لوحة التحكم</div>${T.map(t=>`<a data-t="${t.id}" class="${t.id==TAB?'on':''}">${t.t}</a>`).join('')}<a href="/" target="_blank">👁 معاينة الموقع</a><a id="lo">🚪 تسجيل الخروج</a></aside><main><header><h1>${tb.t}</h1><span id="st">${dirty?'● تعديلات غير محفوظة':''}</span><button id="sv">💾 حفظ ونشر</button></header><div id="ct"></div></main>`;
 if(TAB=='msg')return msgs();
 $('#ct').innerHTML=(tb.f?`<div class="cd">${tb.f.map(f=>F(f[0],f)).join('')}</div>`:'')+(tb.ls||[]).map(LS).join('');reopen=''}
async function msgs(){const c=$('#ct');c.textContent='جارٍ التحميل...';const r=await api('/api/messages').catch(()=>null);if(!r||!r.ok){c.textContent='تعذر تحميل الرسائل';return}
 const m=await r.json();c.innerHTML=m.length?m.map(x=>`<div class="cd msg"><b>${esc(x.name)}</b> · <a href="tel:${esc(x.phone)}">${esc(x.phone)}</a> · <a target="_blank" href="https://wa.me/20${esc(x.phone.replace(/\D/g,'').replace(/^0/,''))}">واتساب</a><br><small>${esc(x.service||'بدون تحديد خدمة')} — ${new Date(x.at).toLocaleString('ar-EG')}</small><p>${esc(x.msg)}</p><button class="b2 dl" data-rm="${esc(x.url)}">حذف</button></div>`).join(''):'<div class="cd">لا توجد رسائل بعد.</div>'}
const img=(f,k)=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const lg=k=='logo',w=Math.min(lg?400:900,im.width),h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);res(c.toDataURL(lg?'image/png':'image/jpeg',.82))};im.src=fr.result};fr.readAsDataURL(f)});
const mark=()=>{dirty=true;const s=$('#st');if(s)s.textContent='● تعديلات غير محفوظة'};
document.addEventListener('input',e=>{const p=e.target.dataset.p;if(p){sp(p,e.target.type=='checkbox'?e.target.checked:e.target.value);mark()}});
document.addEventListener('change',async e=>{const p=e.target.dataset.i,f=e.target.files&&e.target.files[0];if(p&&f){sp(p,await img(f,p));reopen=p.split('.').slice(0,2).join('.');mark();show()}});
document.addEventListener('click',async e=>{const d=e.target.dataset;if(!d)return;
 if(d.t){TAB=d.t;show()}
 else if(e.target.id=='lo'){sessionStorage.clear();location.reload()}
 else if(e.target.id=='sv'){const s=$('#st');s.textContent='جارٍ الحفظ...';const r=await api('/api/content',{method:'PUT',body:JSON.stringify(S)}).catch(()=>null);if(r&&r.ok){dirty=false;s.textContent='✓ تم الحفظ والنشر'}else s.textContent='تعذر الحفظ (تأكد من الاتصال وحجم الصور)'}
 else if(d.x){sp(d.x,'');mark();show()}
 else if(d.ad){e.preventDefault();const a=S[d.ad];a.push(typeof ADD[d.ad]=='string'?'':{...ADD[d.ad]});reopen=d.ad+'.'+(a.length-1);mark();show()}
 else if(d.dl){e.preventDefault();const [l,n]=d.dl.split('.');if(confirm('حذف هذا العنصر؟')){S[l].splice(n,1);mark();show()}}
 else if(d.mv){e.preventDefault();const [l,n,s]=d.mv.split('.').map((v,i)=>i?+v:v),j=n+s,a=S[l];if(j>=0&&j<a.length){[a[n],a[j]]=[a[j],a[n]];reopen=l+'.'+j;mark();show()}}
 else if(d.rm&&confirm('حذف الرسالة؟')){await api('/api/messages?url='+encodeURIComponent(d.rm),{method:'DELETE'});show()}});
addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});
async function load(){const d=await fetch('/api/content',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
 const h=await fetch('/').then(r=>r.text()),def=JSON.parse(h.match(/id="data" type="application\/json">([\s\S]*?)<\/script>/)[1]);
 S={...def,...(d&&d.name?d:{})};show()}
function loginUI(msg){$('#app').innerHTML=`<div class="lgn"><div class="lc"><div class="ic">⚖️</div><h1>لوحة تحكم الموقع</h1><input id="u" placeholder="اسم المستخدم" autocomplete="username"><input id="p" type="password" placeholder="كلمة السر" autocomplete="current-password"><div id="er">${msg||''}</div><button class="bt" id="go">دخول</button></div></div>`;
 const go=async()=>{A={u:$('#u').value.trim(),p:$('#p').value};$('#er').textContent='...';const r=await api('/api/login',{method:'POST'}).catch(()=>null);
  if(r&&r.ok){sessionStorage.setItem('a',JSON.stringify(A));load()}else loginUI('اسم المستخدم أو كلمة السر غير صحيحة')};
 $('#go').onclick=go;$('#p').onkeydown=e=>{if(e.key=='Enter')go()}}
(async()=>{try{A=JSON.parse(sessionStorage.getItem('a'));const r=await api('/api/login',{method:'POST'});if(r.ok)return load()}catch(e){}loginUI()})();
</script></body></html>
