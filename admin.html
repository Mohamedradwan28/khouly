<title>مؤسسة الخولي للمحاماة والاستشارات القانونية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f4ef;--tx:#1b2433;--card:#fff;--mut:#5d6677;--bd:#e4dfd3;--p:#12233f;--a:#c29b4a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1522;--tx:#eef0f4;--card:#17202f;--mut:#a3adbf;--bd:#26324a}}
:root[data-theme="dark"]{--bg:#0e1522;--tx:#eef0f4;--card:#17202f;--mut:#a3adbf;--bd:#26324a}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Cairo,Tahoma,Arial,sans-serif;line-height:1.8}
a{color:inherit;text-decoration:none}.w{max-width:1100px;margin:auto;padding:0 20px}
nav{position:sticky;top:0;z-index:5;background:var(--p);color:#fff}
nav .w{display:flex;justify-content:space-between;align-items:center;height:62px}
nav b{font-size:18px;color:var(--a)}nav div a{margin-inline-start:16px;font-size:14px;opacity:.9}
.hero{position:relative;overflow:hidden;color:#fff;padding:110px 0 100px;text-align:center;background:radial-gradient(circle at 85% 5%,color-mix(in srgb,var(--a) 38%,transparent),transparent 45%),radial-gradient(circle at 5% 95%,#ffffff18,transparent 40%),linear-gradient(135deg,var(--p),#050a14 170%)}.hero:before{content:"⚖";position:absolute;inset-inline-start:-40px;bottom:-90px;font-size:380px;opacity:.06;line-height:1}.hero .w{position:relative}
.hero h1{font-size:clamp(28px,5vw,48px);font-weight:800}.hero h1 span{color:var(--a)}
.hero p{max-width:640px;margin:16px auto 28px;opacity:.88;font-size:17px}
.btn{display:inline-block;padding:13px 28px;border-radius:8px;font-weight:700;background:var(--a);color:#111;border:0;font-family:inherit;font-size:16px;cursor:pointer;margin:4px}
.btn.o{background:transparent;border:1.5px solid var(--a);color:#fff}
section{padding:64px 0}h2{font-size:28px;font-weight:800;margin-bottom:8px}
h2:after{content:"";display:block;width:56px;height:4px;background:var(--a);margin-top:8px;border-radius:2px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px;margin-top:28px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;transition:.2s}
.c:hover{transform:translateY(-4px);border-color:var(--a)}.c i{font-style:normal;font-size:30px}
.c h3{font-size:18px;margin:8px 0 4px}.c p{color:var(--mut);font-size:14px}
ul.k{list-style:none;padding:0;margin-top:10px}ul.k li{font-size:14px;padding:3px 0}ul.k li:before{content:"✓ ";color:var(--a);font-weight:800}
.hot{background:linear-gradient(135deg,var(--p),#000 190%);color:#fff;border-radius:20px;padding:34px;margin-top:26px;display:grid;grid-template-columns:1.2fr 1fr;gap:26px;border:1px solid var(--a)}
.hot h3{font-size:26px;color:var(--a)}.hot b{display:inline-block;background:var(--a);color:#111;font-size:12px;padding:2px 12px;border-radius:20px}
.hot p{opacity:.9;margin:10px 0 16px}.hot ul.k{background:#ffffff12;border-radius:14px;padding:18px;margin:0;align-self:center}
@media(max-width:700px){.hot{grid-template-columns:1fr;padding:22px}}
.alt{background:var(--card)}.cr{display:flex;gap:10px;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:14px}
.cr:before{content:"✦";color:var(--a)}
.tm{text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:16px;overflow:hidden}
.tm img,.tm .ph{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:var(--p);color:var(--a);font-size:60px;line-height:1}
.tm .ph{display:flex;align-items:center;justify-content:center}.tm div.x{padding:16px}.tm h3{font-size:18px}.tm em{color:var(--a);font-style:normal;font-size:14px;font-weight:600}.tm p{color:var(--mut);font-size:13px;margin-top:6px}
footer{background:var(--p);color:#fff;text-align:center;padding:24px 0;font-size:14px}
#ab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:18px;z-index:20;box-shadow:0 4px 16px #0006}
#pn{position:fixed;top:0;bottom:0;left:0;width:min(400px,100%);z-index:30;background:var(--card);color:var(--tx);overflow:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 40px;box-shadow:0 0 30px #0007}
#pn h4{margin:18px 0 6px;color:var(--a)}#pn label{display:block;font-size:12px;color:var(--mut);margin-top:8px}
#pn input,#pn textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--tx);font-family:inherit;font-size:14px}
#pn input[type=color]{height:38px;padding:2px}.it{border:1px dashed var(--bd);border-radius:8px;padding:8px;margin-top:8px}
.sm{padding:5px 12px;font-size:12px;margin:6px 0 0}.dl{background:#c0392b;color:#fff}
.hero h1 span{background:linear-gradient(90deg,var(--a),#f6e3b0);-webkit-background-clip:text;background-clip:text;color:transparent}
.c{border-top:3px solid var(--a);box-shadow:0 6px 24px #0000000f}.c:hover,.tm:hover,.ar:hover{box-shadow:0 14px 36px #00000026}
.tm{transition:.25s;border-top:3px solid var(--a)}.tm:hover{transform:translateY(-4px)}.tm img{border-bottom:3px solid var(--a)}
.ar{background:var(--card);border:1px solid var(--bd);border-top:3px solid var(--a);border-radius:14px;padding:22px;cursor:pointer;transition:.25s;display:flex;flex-direction:column;gap:6px}
.ar:hover{transform:translateY(-4px)}.ar small{color:var(--a);font-weight:700}.ar h3{font-size:18px}.ar p{color:var(--mut);font-size:14px}.ar span{color:var(--a);font-weight:700;font-size:14px;margin-top:auto}
.pr{border-inline-start:4px solid var(--a);padding:6px 16px}.pr h3{font-size:20px}.pr p{color:var(--mut);font-size:15px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}
#md{position:fixed;inset:0;z-index:40;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px}#md[hidden]{display:none}
#md>div{background:var(--card);color:var(--tx);max-width:720px;max-height:88vh;overflow:auto;border-radius:16px;padding:28px;border-top:4px solid var(--a)}#md h3{font-size:24px}#md p{margin-top:12px}
.fw{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));right:18px;z-index:19;background:#25d366;color:#fff;width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 4px 16px #0006}
.btn{transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px #c29b4a55}
.hero .w{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}.ht{text-align:start}.ht p{margin-inline:0}
.hv{display:flex;justify-content:center}.ring{position:relative;width:min(320px,80vw);aspect-ratio:1;border-radius:50%;border:2px solid color-mix(in srgb,var(--a) 50%,transparent);display:flex;align-items:center;justify-content:center;color:var(--a);padding:38px;background:radial-gradient(#ffffff18,transparent 70%)}
.ring:before{content:"";position:absolute;inset:-14px;border-radius:50%;border:2px dashed var(--a);animation:sp 40s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.ring svg{width:100%;height:100%}.hf{width:min(340px,80vw)}
.mq{direction:ltr;background:var(--a);color:#111;overflow:hidden;white-space:nowrap;padding:10px 0;font-weight:700}.mq div{display:inline-block;animation:mq 40s linear infinite}@keyframes mq{to{transform:translateX(-50%)}}
.ab{display:grid;grid-template-columns:.8fr 1.2fr;gap:44px;align-items:center}.lb{margin-bottom:6px}
.fr{position:relative}.fr:before{content:"";position:absolute;inset:14px -14px -14px 14px;border:3px solid var(--a);border-radius:22px}
.fr img,.fr .em{position:relative;width:100%;aspect-ratio:4/5;object-fit:cover;display:block;border-radius:22px}
.em{background:linear-gradient(135deg,var(--p),#050a14);color:var(--a);padding:18%;display:flex;align-items:center}
.nm{display:block;font-size:46px;font-weight:800;color:var(--a);opacity:.85;line-height:1.1}
.c i{display:inline-flex;width:54px;height:54px;border-radius:14px;background:linear-gradient(135deg,var(--a),#f6e3b0);align-items:center;justify-content:center;font-size:26px}
.hot{position:relative;overflow:hidden}.hot:after{content:"";position:absolute;width:320px;height:320px;left:-90px;top:-90px;background:radial-gradient(var(--a),transparent 70%);opacity:.22;pointer-events:none}
.ar img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px}
.dk{background:var(--p);color:#fff}.dk .c{background:#ffffff10;border-color:#ffffff22;border-top-color:var(--a)}.dk .c p{color:#ffffffbb}
.bn{display:flex;align-items:center;gap:8px}#pg{position:fixed;top:0;right:0;height:3px;width:0;background:var(--a);z-index:50}
h2{font-size:34px}
@media(max-width:800px){.hero .w,.ab{grid-template-columns:1fr}.ht{text-align:center}.ht p{margin-inline:auto}.hv{order:-1}.hero{padding:70px 0}}
</style></head><body>

:"صياغة العقود القانونية\nمراجعة العقود\nتأسيس الشركات"},{"i":"💬","t":"الاستشارات والتحكيم","d":"استشارات قانونية للأفراد والشركات وحلول بديلة لفض النزاعات.","p":"استشارات قانونية\nالتحكيم الدولي والتجاري\nالتسوية البديلة للمنازعات"}],"paras":[{"t": "رسالتنا", "d": "تقديم خدمات قانونية وترجمة قانونية دقيقة تحفظ حقوق عملائنا وتبسّط عليهم الإجراءات."}, {"t": "رؤيتنا", "d": "أن نكون الاختيار الأول للأفراد والشركات في الاستشارات القانونية والترجمة المعتمدة وتنفيذ الأحكام."}, {"t": "قيمنا", "d": "الدقة، والسرية، والالتزام بمواعيد التسليم، والوضوح مع العميل في كل خطوة."}],"articles":[{"t": "أهمية الدقة في الترجمة القانونية", "date": "أكتوبر 2026", "img": "", "s": "لماذا يمكن أن تغيّر كلمة واحدة معنى العقد أو الحكم بالكامل.", "b": "الترجمة القانونية تختلف عن الترجمة العادية، لأن لكل مصطلح قانوني معنى محددًا قد يتغير أثره باختلاف النظام القانوني.\nلذلك يجب أن يتولاها متخصص يجمع بين المعرفة القانونية والإتقان اللغوي، وأن تُراجَع قبل التسليم.\nعند ترجمة الأحكام والعقود والمستندات الرسمية، ننصح بالتأكد من اعتماد الترجمة قبل تقديمها لأي جهة."}, {"t": "نظرة عامة على تنفيذ الأحكام", "date": "أكتوبر 2026", "img": "", "s": "خطوات عامة يمر بها تنفيذ الحكم القضائي، وأهمية الاستعانة بمحامٍ متخصص.", "b": "صدور الحكم لا يعني دائمًا تنفيذه فورًا، فقد تحتاج الحالة إلى إجراءات إضافية بحسب نوع الحكم وموقف المحكوم عليه.\nوتزداد الإجراءات تعقيدًا عندما يكون المحكوم عليه شخصًا أو شركة خارج البلاد، وقد يتطلب الأمر ترجمة الأحكام ومتابعة الإجراءات أمام جهات مختلفة.\nهذا المقال معلومات عامة وليس استشارة، ويختلف الحل من قضية لأخرى، لذا يُنصح بعرض تفاصيل قضيتك على محامٍ."}, {"t": "لماذا تهتم بصياغة العقد قبل التوقيع؟", "date": "أكتوبر 2026", "img": "", "s": "عقد محكم الصياغة يحميك من نزاعات كثيرة قبل أن تبدأ.", "b": "كثير من النزاعات سببها غموض بند أو إغفال شرط أساسي في العقد.\nمراجعة العقد قبل توقيعه، وتحديد الالتزامات والمدد وطريقة فض النزاع، من أهم ما يحمي الطرفين.\nننصح بعرض أي عقد مهم على متخصص قبل التوقيع."}],"steps":[{"t": "تواصل معنا", "d": "اتصل أو راسلنا على واتساب واشرح موضوعك باختصار."}, <script>
let S=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s),esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pts=p=>`<ul class="k">${String(p||'').split('\n').filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
let anim=true;
const EM='<svg viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M50 14v66M30 86h40M20 28h60M20 28L8 54M20 28l12 26M80 28L68 54M80 28l12 26M8 54a12 8 0 0024 0M68 54a12 8 0 0024 0"/><circle cx="50" cy="10" r="3" fill="currentColor"/></svg>';
const LG=s=>S.logo?`<img src="${S.logo}" alt="" style="height:${s}px;width:auto;max-width:${s*3}px;object-fit:contain">`:`<span style="display:inline-block;width:${s}px;height:${s}px;color:var(--a)">${EM}</span>`;
function site(){
 const r=document.documentElement.style;r.setProperty('--p',S.primary);r.setProperty('--a',S.accent);
 document.title=S.name+' '+S.tagline;const wa=`https://wa.me/${esc(S.wa)}?text=${encodeURIComponent(S.cta)}`;
 $('#app').innerHTML=`<nav><div class="w"><b class="bn">${LG(32)} ${esc(S.name)}</b><div><a href="#services">${esc(S.h_services)}</a><a href="#team">${esc(S.h_team)}</a><a href="#articles">${esc(S.h_articles)}</a><a href="#creds">${esc(S.h_creds)}</a><a href="#contact">${esc(S.h_contact)}</a></div></div></nav>
<header class="hero"><div class="w"><div class="ht"><h1><span>${esc(S.name)}</span><br>${esc(S.tagline)}</h1><p>${esc(S.hero)}</p><a class="btn" href="${wa}">${esc(S.cta)} ‹</a><a class="btn o" href="tel:${esc(S.phone)}">📞 ${esc(S.phone)}</a></div><div class="hv">${S.heroImg?`<div class="fr hf"><img src="${S.heroImg}" alt=""></div>`:`<div class="ring">${S.logo?LG(150):EM}</div>`}</div></div></header>
<div class="mq"><div>${(()=>{const m=S.services.map(s=>`<span dir="rtl"> ✦ ${esc(s.t)} </span>`).join('');return m+m+m+m})()}</div></div>
<section><div class="w"><div class="ab"><div class="fr">${S.aboutImg?`<img src="${S.aboutImg}" alt="">`:`<div class="em">${EM}</div>`}</div><div><div class="lb">${LG(64)}</div><h2>${esc(S.h_about)}</h2><p style="margin-top:20px">${esc(S.about)}</p></div></div><br><br><div class="g">${S.paras.map(p=>`<div class="pr"><h3>${esc(p.t)}</h3><p>${esc(p.d)}</p></div>`).join('')}</div><div class="g">${S.why.map(x=>`<div class="cr">${esc(x)}</div>`).join('')}</div></div></section>
<section id="services" class="alt"><div class="w"><h2>${esc(S.h_services)}</h2>
${S.services.filter(s=>s.hot).map(s=>`<div class="hot"><div><b>تخصصنا الأبرز</b><h3>${esc(s.i)} ${esc(s.t)}</h3><p>${esc(s.d)}</p><a class="btn" href="${wa}">${esc(S.cta)} ‹</a></div>${pts(s.p)}</div>`).join('')}
<div class="g">${S.services.filter(s=>!s.hot).map(s=>`<div class="c"><i>${esc(s.i)}</i><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p>${pts(s.p)}</div>`).join('')}</div></div></section>
<section><div class="w"><h2>${esc(S.h_steps)}</h2><div class="g">${S.steps.map((s,n)=>`<div class="c"><b class="nm">${n+1}</b><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></div>`).join('')}</div></div></section>
<section id="team" class="alt"><div class="w"><h2>${esc(S.h_team)}</h2><div class="g">${S.team.map(m=>`<div class="tm">${m.img?`<img src="${m.img}" alt="${esc(m.n)}">`:`<div class="ph">⚖</div>`}<div class="x"><h3>${esc(m.n)}</h3><em>${esc(m.r)}</em><p>${esc(m.b)}</p></div></div>`).join('')}</div></div></section>
<section id="articles"><div class="w"><h2>${esc(S.h_articles)}</h2><div class="g">${S.articles.map((a,n)=>`<div class="ar" data-ar="${n}">${a.img?`<img src="${a.img}" alt="">`:''}<small>${esc(a.date)}</small><h3>${esc(a.t)}</h3><p>${esc(a.s)}</p><span>اقرأ المقال ‹</span></div>`).join('')}</div></div></section>
<section id="creds" class="alt"><div class="w"><h2>${esc(S.h_creds)}</h2><div class="g">${S.creds.map(c=>`<div class="cr">${esc(c)}</div>`).join('')}</div></div></section>
<section id="contact" class="dk"><div class="w"><h2>${esc(S.h_contact)}</h2><div class="g">${S.offices.map(o=>`<div class="c"><i>📍</i><h3>${esc(o.city)}</h3><p>${esc(o.addr)}</p></div>`).join('')}<div class="c"><i>📞</i><h3>اتصل الآن</h3><p><a href="tel:${esc(S.phone)}">${esc(S.phone)}</a></p><a class="btn" href="${wa}">${esc(S.cta)} ‹</a></div></div></div></section>
<footer>© ${esc(S.name)} – جميع الحقوق محفوظة</footer><a class="fw" href="${wa}">💬</a>`;
 if(anim){anim=false;const io='IntersectionObserver'in window?new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');io.unobserve(x.target)}}),{threshold:.1}):null;document.querySelectorAll('.c,.tm,.ar,.hot,.pr,.cr,h2').forEach(el=>{el.classList.add('rv');io?io.observe(el):el.classList.add('in')});setTimeout(()=>document.querySelectorAll('.rv').forEach(e=>e.classList.add('in')),2500)}
}
const F=(l,k,tag)=>`<label>${l}</label>${tag=='t'?`<textarea rows=3 data-k="${k}">${esc(S[k])}</textarea>`:`<input ${tag=='c'?'type=color':''} data-k="${k}" value="${esc(S[k])}">`}`;
const I=(key,n,[f,l,t],x)=>{const v=f?x[f]:x,a=`data-l="${key}" data-n="${n}" data-f="${f}"`;return `<label>${l}</label>`+(t=='t'?`<textarea rows=3 ${a}>${esc(v)}</textarea>`:t=='k'?`<input type=checkbox ${a} ${v?'checked':''} style="width:auto">`:`<input ${a} value="${esc(v)}">`)};
const L=(key,fs,up)=>S[key].map((x,n)=>`<div class="it">${fs.map(f=>I(key,n,f,x)).join('')}${up?`<label>الصورة (اختر من جهازك)</label><input type=file accept="image/*" data-img="${key}|${n}|${up}"><button class="btn sm" data-clr="${key}|${n}|${up}">إزالة الصورة</button>`:''}<button class="btn sm dl" data-del="${key}" data-n="${n}">حذف</button></div>`).join('')+`<button class="btn sm" data-add="${key}">+ إضافة</button>`;
const IM=(f,l)=>`<label>${l}</label>${S[f]?`<img src="${S[f]}" style="height:50px;border-radius:6px;display:block;margin:4px 0">`:''}<input type=file accept="image/*" data-img="top|0|${f}"><button class="btn sm" data-clr="top|0|${f}">إزالة</button>`;
function panel(){
 $('#pn').innerHTML=`<button class="btn sm" id="x">✕ إغلاق</button><button class="btn sm" id="sv">💾 حفظ ونشر</button> <span id="ms" style="font-size:12px"></span>
<h4>الشعار والصور</h4>${IM('logo','الشعار (PNG شفاف أفضل)')}${IM('heroImg','صورة الواجهة الرئيسية')}${IM('aboutImg','صورة من نحن')}
<h4>عناوين الأقسام</h4>${['about','services','steps','team','articles','creds','contact'].map(k=>F(k,'h_'+k)).join('')}
<h4>البيانات الأساسية</h4>${F('اسم المؤسسة','name')}${F('العنوان الفرعي','tagline')}${F('نص الواجهة','hero','t')}${F('نص زر الاستشارة','cta')}${F('من نحن','about','t')}
<h4>التواصل والألوان</h4>${F('رقم الهاتف','phone')}${F('رقم واتساب (بكود الدولة)','wa')}${F('اللون الأساسي','primary','c')}${F('لون التمييز','accent','c')}
<h4>فقرات من نحن</h4>${L('paras',[['t','العنوان'],['d','النص','t']])}
<h4>المقالات</h4>${L('articles',[['t','العنوان'],['date','التاريخ'],['s','ملخص قصير','t'],['b','نص المقال (كل فقرة في سطر)','t']],'img')}
<h4>لماذا نحن</h4>${L('why',[['','النص']])}
<h4>خطوات العمل</h4>${L('steps',[['t','العنوان'],['d','الوصف','t']])}
<h4>الخدمات</h4>${L('services',[['hot','تخصص أبرز (مميّز)','k'],['i','الأيقونة'],['t','العنوان'],['d','الوصف','t'],['p','النقاط (كل نقطة في سطر)','t']])}
<h4>فريق العمل</h4>${L('team',[['n','الاسم'],['r','المسمى'],['b','نبذة','t']],'img')}
<h4>الدورات</h4>${L('creds',[['','النص']])}
<h4>المكاتب</h4>${L('offices',[['city','المدينة'],['addr','العنوان']])}`;
}
const msg=t=>{const m=$('#ms');if(m)m.textContent=t};
async function save(){msg('جارٍ الحفظ...');try{const r=await fetch('/api/content',{method:'PUT',headers:{'Content-Type':'application/json','x-admin-password':sessionStorage.getItem('pw')},body:JSON.stringify(S)});msg(r.ok?'✓ تم الحفظ والنشر':'تعذر الحفظ ('+r.status+')')}catch(e){msg('تعذر الحفظ')}}
function admin(){
 $('#admin').innerHTML='<div id="pn" hidden></div>';
 const pn=$('#pn');
 const open=()=>{panel();pn.hidden=false};
 addEventListener('hashchange',()=>{if(location.hash=='#admin')open()});
 document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.altKey&&e.key=='a')open()});
 let k=0;document.addEventListener('click',e=>{if(e.target.closest('footer')&&++k>=5){k=0;open()}});
 if(location.hash=='#admin')open();
 pn.addEventListener('input',e=>{const d=e.target.dataset,v=e.target.type=='checkbox'?e.target.checked:e.target.value;
  if(d.k)S[d.k]=v;
  else if(d.l){if(d.f)S[d.l][d.n][d.f]=v;else S[d.l][d.n]=v}
  site()});
 pn.addEventListener('change',e=>{const dd=e.target.dataset.img,ff=e.target.files&&e.target.files[0];
  if(dd&&ff){const [k,n,fl]=dd.split('|'),lg=k=='top'&&fl=='logo',fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const w=Math.min(lg?400:900,im.width),h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);const u=c.toDataURL(lg?'image/png':'image/jpeg',.82);if(k=='top')S[fl]=u;else S[k][n][fl]=u;site();panel()};im.src=fr.result};fr.readAsDataURL(ff);return}
  const n=e.target.dataset.up,f=e.target.files&&e.target.files[0];if(n==null||!f)return;
  const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const w=480,h=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);S.team[n].img=c.toDataURL('image/jpeg',.82);site();panel()};im.src=fr.result};fr.readAsDataURL(f)});
 pn.addEventListener('click',e=>{const d=e.target.dataset;
  if(e.target.id=='x')pn.hidden=true;
  else if(e.target.id=='sv')save();
  else if(d.clr){const [k,n,f]=d.clr.split('|');if(k=='top')S[f]='';else S[k][n][f]='';site();panel()}
  else if(d.del){S[d.del].splice(d.n,1);site();panel()}
  else if(d.add){const k=d.add;S[k].push(k=='services'?{i:'⚖️',t:'',d:'',p:'',hot:false}:k=='steps'?{t:'',d:''}:k=='paras'?{t:'',d:''}:k=='articles'?{t:'',date:'',s:'',b:'',img:''}:k=='team'?{n:'',r:'',b:'',img:''}:k=='offices'?{city:'',addr:''}:'');site();panel()}});
}
addEventListener('scroll',()=>{const h=document.documentElement.scrollHeight-innerHeight;$('#pg').style.width=h>0?scrollY/h*100+'%':'0'});
document.addEventListener('click',e=>{const m=$('#md'),c=e.target.closest('[data-ar]');
 if(c){const a=S.articles[c.dataset.ar];m.innerHTML=`<div><button class="btn sm" id="mx">✕ إغلاق</button><br>${a.img?`<img src="${a.img}" alt="" style="width:100%;border-radius:12px;margin:10px 0">`:''}<small style="color:var(--a)">${esc(a.date)}</small><h3>${esc(a.t)}</h3>${String(a.b).split('\n').filter(Boolean).map(x=>`<p>${esc(x)}</p>`).join('')}</div>`;m.hidden=false}
 else if(e.target===m||e.target.id=='mx')m.hidden=true});
(async()=>{let pw=sessionStorage.getItem('pw');
 for(;;){if(!pw)pw=prompt('كلمة سر لوحة التحكم');if(!pw){document.body.innerHTML='';return}
  const r=await fetch('/api/content?check=1',{headers:{'x-admin-password':pw}});
  if(r.ok){sessionStorage.setItem('pw',pw);break}pw=null;sessionStorage.removeItem('pw');alert('كلمة السر غير صحيحة')}
 const d=await fetch('/api/content',{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
 if(d&&d.name)S=d;site();admin();$('#pn').hidden=false;panel();
 document.body.insertAdjacentHTML('beforeend','<button class="btn" style="position:fixed;bottom:18px;left:18px;z-index:20" id="ob">⚙️ لوحة التحكم</button>');$('#ob').onclick=()=>{panel();$('#pn').hidden=false}})();
</script></body></html>
